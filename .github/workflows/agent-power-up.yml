name: Agent Power Up checks
on:
  pull_request:
    paths: ['apps/agent-power-up/**', '.github/workflows/agent-power-up.yml']
  push:
    branches: ['agent-power-up-platform', 'agent-power-up-ui']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent-power-up
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/agent-power-up/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
